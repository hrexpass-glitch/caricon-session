<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Session App</title>
    <style>
        /* ミニマル・クールなデザイン */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; flex-grow: 1; }
        h2 { font-weight: 300; letter-spacing: 2px; color: #bb86fc; }
        
        textarea {
            width: 100%;
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .controls { display: flex; gap: 10px; margin-top: 20px; }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #btn-start { background-color: #03dac6; color: #000; }
        #btn-start:disabled { background-color: #333; color: #666; }
        #btn-stop { background-color: #cf6679; color: #fff; display: none; }
        
        .status { margin-top: 10px; font-size: 12px; color: #777; }
        .recording-mark { color: #cf6679; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SESSION RECORD</h2>
        <div class="status">状態: <span id="status-text">待機中</span> <span class="recording-mark" id="mark">● 録音中</span></div>
        <textarea id="output" placeholder="ここに逐語録が表示されます..."></textarea>

        <div class="controls">
            <button id="btn-start" onclick="startSession()">記録開始</button>
            <button id="btn-stop" onclick="stopSession()">記録停止・保存</button>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('status-text');
        const mark = document.getElementById('mark');

        // 音声認識の設定
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;

        if (!SpeechRecognition) {
            alert("このブラウザは音声認識に対応していません。最新のChromeでお試しください。");
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = true; // 途中経過も表示する

            // 文字を認識したとき
            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.results.index; i < event.results.length; i++) {
                    let transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + "\n";
                    }
                }
                if (finalTranscript) {
                    output.value += finalTranscript;
                    output.scrollTop = output.scrollHeight; // 自動スクロール
                    saveData();
                }
            };

            // スマホ等で勝手に止まったとき
            recognition.onend = () => {
                if (isRecording) {
                    console.log("再起動します...");
                    recognition.start();
                }
            };

            recognition.onerror = (event) => {
                console.error("Error: ", event.error);
                if(event.error === 'not-allowed') alert("マイクの使用が許可されていません。");
            };
        }

        function startSession() {
            isRecording = true;
            output.value = ""; // 新規開始
            try {
                recognition.start();
                btnStart.style.display = "none";
                btnStop.style.display = "block";
                statusText.innerText = "認識中...";
                mark.style.display = "inline";
            } catch (e) {
                console.log(e);
            }
        }

        function stopSession() {
            isRecording = false;
            recognition.stop();
            btnStart.style.display = "block";
            btnStop.style.display = "none";
            statusText.innerText = "保存済み";
            mark.style.display = "none";
            saveData();
            alert("データを保存しました。");
        }

        // データの保存（ファイル名が変わってもOKなように固定キーを使用）
        function saveData() {
            localStorage.setItem('career_session_backup', output.value);
        }

        // ページを開いたときに前回のデータを復元（念のため）
        window.onload = () => {
            const saved = localStorage.getItem('career_session_backup');
            if (saved) output.value = saved;
        };
    </script>
</body>
</html>
